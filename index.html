<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑 링크 찾기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Apple SD Gothic Neo', '맑은 고딕', sans-serif;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }

    .emoji { font-size: 56px; margin-bottom: 16px; }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 36px;
      line-height: 1.6;
    }

    .input-wrap {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    input {
      flex: 1;
      padding: 16px 20px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 4px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: #667eea; }

    button {
      padding: 16px 24px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.97); }

    #result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      font-size: 15px;
      display: none;
    }

    #result.success {
      background: #f0fdf4;
      border: 2px solid #86efac;
      color: #166534;
      display: block;
    }

    #result.error {
      background: #fef2f2;
      border: 2px solid #fca5a5;
      color: #991b1b;
      display: block;
    }

    #result a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 32px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 16px;
    }

    .notice {
      margin-top: 28px;
      padding: 14px;
      background: #fff8e1;
      border-radius: 10px;
      font-size: 12px;
      color: #888;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🛍️</div>
    <h1>상품 링크 찾기</h1>
    <p class="subtitle">영상에서 알려드린 번호를 입력하시면<br>바로 상품 링크로 안내해 드려요!</p>

    <div class="input-wrap">
      <input
        type="text"
        id="numInput"
        placeholder="번호 입력"
        maxlength="6"
        inputmode="numeric"
        autofocus
      >
      <button onclick="findProduct()">찾기</button>
    </div>

    <div id="result"></div>

    <div class="notice">
      ※ 본 페이지의 링크는 광고 제휴 링크입니다.<br>
      구매 시 소정의 수수료가 발생할 수 있습니다.
    </div>
  </div>

  <script>
    let products = [];

    fetch('./products.json?t=' + Date.now())
      .then(r => r.json())
      .then(data => { products = data; })
      .catch(() => { products = []; });

    document.getElementById('numInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') findProduct();
    });

    function findProduct() {
      const num = document.getElementById('numInput').value.trim().padStart(3, '0');
      const result = document.getElementById('result');
      const product = products.find(p => p.num === num);

      if (product && product.link) {
        result.className = 'success';
        result.innerHTML = `
          <div>✅ <strong>${product.name}</strong> 찾았어요!</div>
          ${product.price ? `<div style="margin-top:6px;color:#555">가격: ${product.price}</div>` : ''}
          <a href="${product.link}" target="_blank" rel="noopener">👉 상품 바로가기</a>
        `;
        setTimeout(() => window.open(product.link, '_blank'), 800);
      } else {
        result.className = 'error';
        result.innerHTML = `❌ 번호 <strong>${num}</strong>에 해당하는 상품을 찾을 수 없어요.<br><small>번호를 다시 확인해 주세요.</small>`;
      }
    }
  </script>
</body>
</html>
